# 2026-09-26 Snug night (Wright, on Keemin's go for caching): the World page asks
# /api/world/present with its own camera x/y, so an exact-args cache key missed on
# every visitor. x/y only choose "who is near this point, nearest first"; viewers
# within ~1 km can share one answer. These maps round each coordinate to a
# 1 km grid for the CACHE KEY only (the office still receives the exact args).
map $arg_x $pm_qx { "~^(-?)([0-9]*?)[0-9]{1,3}(\.[0-9]*)?$" "$1$2"; default $arg_x; }
map $arg_y $pm_qy { "~^(-?)([0-9]*?)[0-9]{1,3}(\.[0-9]*)?$" "$1$2"; default $arg_y; }
