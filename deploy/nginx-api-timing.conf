# Install as /etc/nginx/conf.d/postmark-api-timing.conf (POS-267, 2026-09-27):
#
#     sudo cp deploy/nginx-api-timing.conf /etc/nginx/conf.d/postmark-api-timing.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# A SECOND access log, for /api/ only, that carries how long each request took.
# The main log (/var/log/nginx/access.log, format `vhost`, nginx.conf) is left
# exactly as it is. On the Snug Harbour night (2026-09-26) the slow path was
# found with a live CPU profile because nothing recorded request times; this
# log names the slow route in minutes.
#
# WHY NGINX AND NOT THE OFFICE'S OWN TELEMETRY. telemetry/access-*.jsonl carries
# `ms`, but that clock starts when the office's handler runs. A request that
# waited in the listen backlog, or behind a busy thread, waited BEFORE that
# clock started, so the office undercounts exactly the wait a brownout is made
# of. nginx's $request_time runs from the client's first byte to the last byte
# sent, and $upstream_header_time is how long the office took to answer at all.
#
# HOW IT ATTACHES. This file is included in http {} (nginx.conf's
# `include /etc/nginx/conf.d/*.conf`), the same level as the main access_log,
# and nginx writes every access_log declared at one level. No server {} that
# fronts the office declares an access_log of its own (checked on the box
# 2026-09-27: only sites-available/mio-web does, and it is not the office), so
# both logs apply to every request and `if=` keeps this one to /api/. A server
# block that later declares its own access_log would silently drop BOTH logs
# for itself; that is nginx's inheritance rule, not this file's.
#
# FIELDS, and who reads them. The reader today is the operator during an event
# (the one-liner below); a traffic-report column can follow.
#   time             $time_iso8601, to line up with the office's own telemetry
#   host             postmark.town, starforge-atelier.online or dev.postmark.town
#   method, path     the path WITHOUT its query string: a query can carry an
#                    OAuth code, and timing does not need it
#   status           the answer the client got (a 429 from the shield included)
#   rt               $request_time, seconds, what the client waited
#   uct / uht / urt  upstream connect, first byte, and full response times; "-"
#                    when nginx answered by itself (a cache hit, the 429 shield)
#   cache            $upstream_cache_status: HIT, STALE, UPDATING, MISS, or "-"
#   bytes            $body_bytes_sent
#
# Read it during an event, slowest routes first (p95 of rt per path):
#
#     sudo awk '{print $4, $6}' /var/log/nginx/postmark-api-timing.log \
#       | sed 's/rt=//' | sort -k1,1 -k2,2n \
#       | awk '{a[$1]=a[$1]" "$2; n[$1]++} END {for (p in a) {split(a[p],v," "); print n[p], v[int(n[p]*0.95)+1], p}}' \
#       | sort -k2,2nr | head
#
# Rotation: /etc/logrotate.d/nginx already rotates /var/log/nginx/*.log daily
# (rotate 14, compress), which covers this file with no edit.

map $request_uri $postmark_api_timing {
    "~^/api(/|$)" 1;
    default       0;
}

map $request_uri $postmark_api_timing_path {
    "~^(?<pm_timing_path>[^?]*)" $pm_timing_path;
}

log_format postmark_api_timing '$time_iso8601 $host $request_method $postmark_api_timing_path $status '
                               'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                               'urt=$upstream_response_time cache=$upstream_cache_status bytes=$body_bytes_sent';

access_log /var/log/nginx/postmark-api-timing.log postmark_api_timing if=$postmark_api_timing;
